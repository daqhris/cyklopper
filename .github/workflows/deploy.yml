name: Deploy to OVH

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject last-modified date
        run: |
          COMMIT_EPOCH=$(git log -1 --format="%ct")
          NOW_EPOCH=$(date +%s)
          DIFF_SECONDS=$(( NOW_EPOCH - COMMIT_EPOCH ))
          DIFF_MINUTES=$(( DIFF_SECONDS / 60 ))
          DIFF_HOURS=$(( DIFF_SECONDS / 3600 ))
          DIFF_DAYS=$(( DIFF_SECONDS / 86400 ))

          if [ "$DIFF_MINUTES" -lt 60 ]; then
            LABEL_FR="il y a ${DIFF_MINUTES} min"
            LABEL_NL="${DIFF_MINUTES} min geleden"
            LABEL_EN="${DIFF_MINUTES} min ago"
          elif [ "$DIFF_HOURS" -lt 24 ]; then
            LABEL_FR="il y a ${DIFF_HOURS}h"
            LABEL_NL="${DIFF_HOURS}u geleden"
            LABEL_EN="${DIFF_HOURS}h ago"
          else
            LABEL_FR="il y a ${DIFF_DAYS} jours"
            LABEL_NL="${DIFF_DAYS} dagen geleden"
            LABEL_EN="${DIFF_DAYS} days ago"
          fi

          sed -i "s|GIT_LAST_MODIFIED_FR|${LABEL_FR}|g" index.html
          sed -i "s|GIT_LAST_MODIFIED_NL|${LABEL_NL}|g" index.html
          sed -i "s|GIT_LAST_MODIFIED_EN|${LABEL_EN}|g" index.html
          echo "Injected FR: $LABEL_FR | NL: $LABEL_NL | EN: $LABEL_EN"

      - name: Deploy via FTP to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /