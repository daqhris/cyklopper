{% extends 'base.html' %}

{% block content %}

		<section id="part-top">
				<h1>
					{{ config.baseline }}
				</h1>
		</section>

		{% for item in nav if item.title != 'actu' %}
			<section id="part{{loop.index}}">
						{{ item.content }}
			</section>
		{% endfor %}

		<section id="galery">
			<div class="slide">
				{% for image in config.galery%}
					<img src="{{ image }}" alt="">
				{% endfor %}

			</div>
		</section>

		<section id="part-end">
			<a href="https://www.facebook.com/atelierCyklopper/" class="bulle"> Facebook </a>
			<a href="https://www.instagram.com/cyklopper/?__d=1%2F" class="bulle"> Instagram </a>
			<a href="mailto:ateliercyklopper@protonmail.com" class="bulle">Contact</a>

		</section>


{% endblock %}
